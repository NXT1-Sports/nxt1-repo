# ============================================================================
# NXT1 Monorepo - Deploy Firebase Cloud Functions
# ============================================================================
# Deploys Cloud Functions when changes are pushed to main.
#
# Architecture:
#   - Firebase App Hosting handles web (Angular SSR)
#   - Backend (Express API) deploys separately via deploy-backend.yml over SSH/PM2
#   - This workflow handles Cloud Functions ONLY (firebase deploy --only functions)
#
# Trigger paths:
#   - apps/functions/**   → Functions source code
#   - packages/core/**    → Shared types (functions depend on @nxt1/core)
#
# Branches:
#   - main       → auto-deploy to STAGING
#   - production → auto-deploy to STAGING + PRODUCTION
#
# Projects (from .firebaserc):
#   - staging:    nxt-1-staging-v2
#   - production: nxt-1-v2
# ============================================================================

name: Deploy Functions

on:
  push:
    branches: [main, production]
    paths:
      - 'apps/functions/src/**'
      - 'apps/functions/package.json'
      - 'apps/functions/tsconfig.json'
      - 'packages/core/src/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      functions:
        description: 'Specific functions to deploy (comma-separated, blank = all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.22.3'

jobs:
  determine-deploy:
    name: Determine Deploy Scope
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.scope.outputs.should_deploy }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether deploy is required
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing base SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" "$head_sha" -- \
              apps/functions/src \
              apps/functions/package.json \
              apps/functions/tsconfig.json \
              packages/core/src \
              firebase.json \
              .github/workflows/deploy-functions.yml
          )

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=no functions-related changes detected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ${#changed_files[@]} -eq 1 && "${changed_files[0]}" == "apps/functions/package.json" ]]; then
            non_version_diff="$(
              git diff --unified=0 "$base_sha" "$head_sha" -- apps/functions/package.json \
                | sed '/^diff --git /d;/^index /d;/^--- /d;/^+++ /d;/^@@ /d;/^[+-][[:space:]]*"version":/d'
            )"

            if [[ -z "$non_version_diff" ]]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "reason=skip release version-only functions package bump" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=functions runtime inputs changed" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # VALIDATE - Type check and build before deploying
  # ============================================================================
  validate:
    name: Validate Functions
    runs-on: ubuntu-latest
    needs: determine-deploy
    if: needs.determine-deploy.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build @nxt1/core (dependency)
        run: npm run build:core

      - name: Typecheck functions
        working-directory: apps/functions
        run: npm run typecheck

      - name: Validate structure
        working-directory: apps/functions
        run: node validate-structure.js

      - name: Build functions
        working-directory: apps/functions
        run: npm run build

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build @nxt1/core (dependency)
        run: npm run build:core

      - name: Build functions
        working-directory: apps/functions
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Firebase (Staging)
        run: npx --yes firebase-tools@15.22.0 deploy --only ${{ github.event.inputs.functions && format('functions:{0}', github.event.inputs.functions) || 'functions' }} --project nxt-1-staging-v2 --force

      - name: Re-enable blocking function token forwarding (Staging)
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          curl -s -X PATCH \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/nxt-1-staging-v2/config?updateMask=blockingFunctions.forwardInboundCredentials" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"blockingFunctions":{"forwardInboundCredentials":{"idToken":true,"accessToken":true,"refreshToken":true}}}' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Token forwarding:', r.get('blockingFunctions',{}).get('forwardInboundCredentials','ERROR'))"

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # Auto: push to production branch
  # Manual: workflow_dispatch → pick "production"
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, deploy-staging]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/production') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build @nxt1/core (dependency)
        run: npm run build:core

      - name: Build functions
        working-directory: apps/functions
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Firebase (Production)
        run: npx --yes firebase-tools@15.22.0 deploy --only ${{ github.event.inputs.functions && format('functions:{0}', github.event.inputs.functions) || 'functions' }} --project nxt-1-v2 --force

      - name: Re-enable blocking function token forwarding (Production)
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          curl -s -X PATCH \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/nxt-1-v2/config?updateMask=blockingFunctions.forwardInboundCredentials" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"blockingFunctions":{"forwardInboundCredentials":{"idToken":true,"accessToken":true,"refreshToken":true}}}' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Token forwarding:', r.get('blockingFunctions',{}).get('forwardInboundCredentials','ERROR'))"

  skip-noop-deploy:
    name: Skip No-Op Deploy
    runs-on: ubuntu-latest
    needs: determine-deploy
    if: needs.determine-deploy.outputs.should_deploy != 'true'
    steps:
      - name: Explain skipped deploy
        run: |
          echo "Skipping Functions deploy."
          echo "Reason: ${{ needs.determine-deploy.outputs.reason }}"
