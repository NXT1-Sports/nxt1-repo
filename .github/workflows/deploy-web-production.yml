# ============================================================================
# Deploy Web App to Firebase Hosting Production
# ============================================================================
# Auto-deploys the Angular web app to Firebase Hosting (production) on every
# push to the production branch. Only runs when web-relevant files are changed.
#
# URL: https://nxt-1-v2.web.app
# Project: nxt-1-v2
# Secret required: FIREBASE_SERVICE_ACCOUNT_PROD
# ============================================================================

name: Deploy Web Production

on:
  push:
    branches: [production]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/server.ts'
      - 'packages/core/src/**'
      - 'packages/ui/src/**'
      - 'packages/design-tokens/**'
      - 'apps/web/package.json'
      - 'apps/web/angular.json'
      - 'apps/web/tailwind.config.js'
      - 'package.json'
      - 'turbo.json'
      - 'apphosting.yaml'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web-production.yml'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: deploy-web-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.3'

jobs:
  deploy-production:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack
        run: corepack enable npm

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-web-production-${{ hashFiles('packages/core/src/**', 'packages/ui/src/**', 'packages/design-tokens/**') }}
          restore-keys: |
            turbo-web-production-

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        # --force bypasses Turbo remote cache to guarantee fresh package builds on every deploy
        run: npx turbo run build --filter=@nxt1/core --filter=@nxt1/ui --force
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Clean web build artifacts
        working-directory: apps/web
        run: npm run clean

      - name: Build web app (production config)
        working-directory: apps/web
        run: npm run build

      - name: Deploy to Firebase Hosting Production
        uses: w9jds/firebase-action@v15.20.0
        with:
          args: deploy --only hosting -P production --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
