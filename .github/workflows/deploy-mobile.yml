# ============================================================================
# NXT1 Monorepo - Mobile Build & Deploy Pipeline
# ============================================================================
# Branch strategy:
#   main       → iOS: appstore cert → IPA → TestFlight
#                Android: release AAB → Play Store Internal Track
#   production → iOS: appstore cert → IPA → TestFlight → App Store submission
#                Android: release AAB → Play Store Production
#   workflow_dispatch → manual run with profile choice (staging | production)
# ============================================================================

name: Deploy Mobile

on:
  push:
    branches: [production]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'staging → TestFlight + Play Internal | production → App Store + Play Production'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.22.3'
  CI: true

jobs:
  # ============================================================================
  # DERIVE PROFILE FROM BRANCH OR MANUAL INPUT
  # ============================================================================
  setup:
    name: Derive Build Profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.derive.outputs.profile }}
    steps:
      - name: Derive profile
        id: derive
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PROFILE="${{ inputs.profile }}"
          elif [ "${{ github.ref_name }}" == "production" ]; then
            PROFILE="production"
          else
            PROFILE="staging"
          fi
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
          echo "▶ Build profile: $PROFILE"

  # ============================================================================
  # BUILD WEB ASSETS
  # ============================================================================
  build-web-assets:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web assets
        run: npm run build:mobile
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: mobile-www
          path: apps/mobile/www
          retention-days: 1

  # ============================================================================
  # BUILD iOS
  #   staging    → appstore cert → IPA → TestFlight
  #   production → appstore cert → IPA → TestFlight → submit App Store review
  # ============================================================================
  build-ios:
    name: Build iOS (${{ needs.setup.outputs.profile }})
    runs-on: macos-latest
    needs: [setup, build-web-assets]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios'))
    environment:
      name: ${{ needs.setup.outputs.profile }}
    env:
      BUILD_PROFILE: ${{ needs.setup.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable npm

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: mobile-www
          path: apps/mobile/www

      - name: Install Node dependencies
        run: npm ci

      - name: Switch Firebase config
        working-directory: apps/mobile
        run: node scripts/auto-switch-firebase-env.js ${{ env.BUILD_PROFILE }}

      # Keep iOS on copy, not sync: @capacitor-firebase/analytics requires an
      # explicit CocoaPods subspec in Podfile, and cap sync regenerates that
      # file back to the plugin's Lite default.
      - name: Sync Capacitor web assets to iOS
        working-directory: apps/mobile
        env:
          BUILD_PLATFORM: ios
        run: npx cap copy ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/ios/App

      # IONGeolocationLib 1.0.1 ships a pre-compiled XCFramework built with
      # Swift 6.2.3 (swiftlang-6.2.3.3.21). Xcode 26.2 is the only matching version.
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Show Xcode / Swift version
        run: xcodebuild -version && swift --version

      - name: Install CocoaPods (with retry for CDN flakiness)
        working-directory: apps/mobile/ios/App
        run: |
          set -e
          retry() {
            local max=5 delay=15 n=1
            until "$@"; do
              [ $n -ge $max ] && { echo "::error::Failed after $n attempts: $*"; return 1; }
              echo "::warning::Attempt $n failed — retrying in ${delay}s..."
              sleep $delay; n=$((n+1)); delay=$((delay*2))
            done
          }
          retry pod repo update
          retry pod update IONGeolocationLib --no-repo-update
          retry pod install --repo-update

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_CONTENT=$(echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | awk 'NF {printf "%s\\n", $0}')
          cat > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.json << EOF
          {
            "key_id": "${APP_STORE_CONNECT_API_KEY_ID}",
            "issuer_id": "${APP_STORE_CONNECT_API_ISSUER_ID}",
            "key": "${KEY_CONTENT}",
            "in_house": false
          }
          EOF

      - name: Build iOS app (release lane — appstore cert)
        working-directory: apps/mobile/ios/App
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
        run: bundle exec fastlane release

      - name: Upload gym build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-log-${{ env.BUILD_PROFILE }}
          path: ~/Library/Logs/gym/App-App.log
          retention-days: 7

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ env.BUILD_PROFILE }}
          path: apps/mobile/ios/App/build/*.ipa
          retention-days: 30

      # Upload to TestFlight — runs for BOTH staging and production
      - name: Upload to TestFlight
        working-directory: apps/mobile/ios/App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane upload_testflight

      # Submit for App Store review — DISABLED (uncomment when ready)
      # - name: Submit to App Store
      #   if: env.BUILD_PROFILE == 'production'
      #   working-directory: apps/mobile/ios/App
      #   env:
      #     APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      #     APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      #     APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      #   run: fastlane submit_app_store

  # ============================================================================
  # BUILD ANDROID
  #   staging    → release AAB → Play Store Internal Track
  #   production → release AAB → Play Store Production
  # ============================================================================
  build-android:
    name: Build Android (${{ needs.setup.outputs.profile }})
    runs-on: ubuntu-latest
    needs: [setup, build-web-assets]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android'))
    environment:
      name: ${{ needs.setup.outputs.profile }}
    env:
      BUILD_PROFILE: ${{ needs.setup.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: mobile-www
          path: apps/mobile/www

      - name: Install Node dependencies
        run: npm ci

      - name: Switch Firebase config
        working-directory: apps/mobile
        run: node scripts/auto-switch-firebase-env.js ${{ env.BUILD_PROFILE }}

      - name: Sync Capacitor plugins and web assets to Android
        working-directory: apps/mobile
        env:
          BUILD_PLATFORM: android
        run: npx cap sync android

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/nxt1-release.keystore
          cat > apps/mobile/android/key.properties << EOF
          storeFile=nxt1-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          # Write google-play-key.json here so the release lane can call
          # google_play_track_version_codes before we reach the upload steps
          echo "$GOOGLE_PLAY_JSON_KEY" > apps/mobile/android/google-play-key.json

      - name: Build Android (release AAB)
        working-directory: apps/mobile/android
        run: |
          if [ "$BUILD_PROFILE" == "production" ]; then
            bundle exec fastlane release
          else
            bundle exec fastlane release_staging
          fi

      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ env.BUILD_PROFILE }}
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Upload to Play Internal Track — staging only
      - name: Upload to Play Store Internal Track
        if: env.BUILD_PROFILE == 'staging'
        working-directory: apps/mobile/android
        run: bundle exec fastlane upload_internal

      # Upload to Play Store Production — upload the newly built production AAB
      - name: Upload to Play Store Production
        if: env.BUILD_PROFILE == 'production'
        working-directory: apps/mobile/android
        run: bundle exec fastlane upload_production
