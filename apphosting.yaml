# Firebase App Hosting Configuration - 2026 Best Practices
# @see https://firebase.google.com/docs/app-hosting/build-monorepos
#
# For Turborepo monorepos, we bypass the automatic Angular adapter
# which fails to parse JSON output due to Turborepo's prefixed logging

runtimeConfig:
  nodeVersion: 22

# Build from the monorepo root so App Hosting uses the workspace lockfile
# and root gcp-build script for @nxt1/web.
rootDirectory: .

# Explicitly specify the server entry point (path from workspace root)
scripts:
  runCommand: node apps/web/dist/nxt1-web/server/server.mjs

# Runtime configuration
runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 1
  maxInstances: 10

# Environment variables
env:
  - variable: NODE_VERSION
    value: '22.22.3'
  - variable: NODE_ENV
    value: 'production'

  # Backend API URL for proxying sitemap and other XML endpoints
  - variable: BACKEND_URL
    value: 'https://api.nxt1sports.com'

  # Public production origin used for SSR redirects and absolute URL generation
  - variable: PUBLIC_URL
    value: 'https://nxt1sports.com'

  # Explicit production API base URL keeps SSR and browser requests aligned
  - variable: BACKEND_API_URL
    value: 'https://api.nxt1sports.com/api/v1'

  # Allow SSR for ALL hosts (Firebase App Hosting handles security at the load balancer)
  # Using wildcard to avoid host mismatch issues with envoy proxy
  - variable: NG_ALLOWED_HOSTS
    value: '*'

  # App Hosting builds @nxt1/core as part of the web pipeline, and that build
  # needs devDependencies for TypeScript declarations (e.g. vitest and type-only packages).
  - variable: NPM_CONFIG_PRODUCTION
    value: 'false'
  - variable: NPM_CONFIG_INCLUDE
    value: 'dev'
  - variable: NOTION_API_TOKEN
    secret: NOTION_API_TOKEN

  # Weekly KPIs Notion automation (production)
  - variable: NOTION_WEEKLY_KPIS_ENABLED
    value: 'true'
  - variable: PRODUCTION_NOTION_WEEKLY_KPIS_DATABASE_ID
    value: 'd9d021268e784dbcaa781bcdd7a688d1'

# Custom headers for all responses
headers:
  # Security headers + default no-cache for all SSR routes
  - source: '**'
    headers:
      - header: X-Content-Type-Options
        value: nosniff
      - header: X-Frame-Options
        value: SAMEORIGIN
      - header: X-XSS-Protection
        value: '1; mode=block'
      - header: Referrer-Policy
        value: strict-origin-when-cross-origin
      - header: Cache-Control
        value: 'no-cache, no-store, must-revalidate'

  # Cache static assets aggressively
  - source: '**/*.{js,css,woff2,woff,ttf,png,jpg,jpeg,gif,svg,ico,webp}'
    headers:
      - header: Cache-Control
        value: 'public, max-age=31536000, immutable'

  # Don't cache HTML pages (SSR generates fresh content)
  - source: '**/*.html'
    headers:
      - header: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
secrets:
  - variable: MONGO
    secret: MONGO
