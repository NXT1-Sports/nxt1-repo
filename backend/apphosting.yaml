# Firebase App Hosting Configuration - Backend Express API
# App Hosting Backend ID: nxt1-repo-backend
# @see https://firebase.google.com/docs/app-hosting/configure
#
# rootDirectory in Firebase console is set to: backend/
# All paths in scripts are relative to the backend/ directory.
# "cd .." goes up to the monorepo root to install all workspace dependencies.

runtimeConfig:
  nodeVersion: 22

scripts:
  # Install all monorepo deps, then run the backend build script directly.
  # This guarantees dist/index.js exists for runCommand in App Hosting.
  buildCommand: >-
    cd .. &&
    npm ci --include=dev &&
    npm --prefix backend run build
  runCommand: node dist/index.js

runConfig:
  # Backend handles AI workloads — needs more CPU/RAM than the SSR frontend
  cpu: 2
  memoryMiB: 2048
  concurrency: 80
  minInstances: 1
  maxInstances: 20

  # Give the backend enough time to connect to MongoDB + Redis on cold start
  startupProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 20
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 6

env:
  - variable: NODE_VERSION
    value: '22.22.3'
  # App Hosting injects env vars at runtime — dotenv is a no-op in production
  - variable: NODE_ENV
    value: 'staging'
  - variable: BACKEND_URL
    value: 'https://api.nxt1sports.com'
  - variable: PUBLIC_URL
    value: 'https://staging.nxt1sports.com'
  - variable: STAGING_APP_URL
    value: 'https://staging.nxt1sports.com'
  - variable: STAGING_ALLOWED_FRONTEND_ORIGINS
    value: 'https://staging.nxt1sports.com,https://nxt-1-staging-v2.web.app,https://nxt-1-staging-v2.firebaseapp.com,https://nxt1-repo--nxt-1-staging-v2.us-east4.hosted.app,https://nxt1-repo--nxt-1-staging-v2.us-central1.hosted.app'
  - variable: NOTION_SIGNUP_DASHBOARD_ENABLED
    value: 'true'
  - variable: NOTION_SIGNUP_DASHBOARD_DATABASE_ID
    value: '34688000-7496-421b-be57-a11e2f3a6f40'
  - variable: NOTION_API_TOKEN
    secret: NOTION_API_TOKEN
    availability:
      - RUNTIME
  - variable: MEDIA_PROXY_HMAC_SECRET
    secret: media-proxy-hmac-secret
  # Allow devDependencies during build (needed for TypeScript compiler + shx)
  - variable: NPM_CONFIG_PRODUCTION
    value: 'false'
  - variable: NPM_CONFIG_INCLUDE
    value: 'dev'
  - variable: MONGO
    secret: MONGO
    availability:
      - RUNTIME
  - variable: CLOUDFLARE_WEBHOOK_SECRET
    secret: CLOUDFLARE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_TEST_SECRET_KEY
    secret: STRIPE_TEST_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_TEST_WEBHOOK_SECRET
    secret: STRIPE_TEST_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: CHART_MCP_URL
    secret: CHART_MCP_URL
    availability:
      - RUNTIME
  - variable: CHART_MCP_API_TOKEN
    secret: CHART_MCP_API_TOKEN
    availability:
      - RUNTIME
