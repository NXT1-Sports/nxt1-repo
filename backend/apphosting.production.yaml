# Firebase App Hosting Configuration - Backend Express API (Production override)
# This file is for the nxt-1-v2 App Hosting environment only.

runtimeConfig:
  nodeVersion: 22

scripts:
  buildCommand: >-
    cd .. &&
    npm ci --include=dev &&
    npm --prefix backend run build
  runCommand: node dist/index.js

runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 80
  minInstances: 1
  maxInstances: 20

  startupProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 20
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 6

env:
  - variable: NODE_VERSION
    value: '22.22.3'
  - variable: NODE_ENV
    value: 'production'
  - variable: BACKEND_URL
    value: 'https://api.nxt1sports.com'
  - variable: PUBLIC_URL
    value: 'https://nxt1sports.com'
  - variable: ALLOWED_FRONTEND_ORIGINS
    value: 'https://nxt1sports.com,https://www.nxt1sports.com,https://nxt-1-v2.web.app,https://nxt-1-v2.firebaseapp.com'
  - variable: STAGING_APP_URL
    value: 'https://staging.nxt1sports.com'
  - variable: STAGING_ALLOWED_FRONTEND_ORIGINS
    value: 'https://staging.nxt1sports.com,https://nxt-1-staging-v2.web.app,https://nxt-1-staging-v2.firebaseapp.com,https://nxt1-repo--nxt-1-staging-v2.us-east4.hosted.app,https://nxt1-repo--nxt-1-staging-v2.us-central1.hosted.app'
  - variable: NOTION_SIGNUP_DASHBOARD_ENABLED
    value: 'true'
  - variable: NOTION_SIGNUP_DASHBOARD_DATABASE_ID
    value: '34688000-7496-421b-be57-a11e2f3a6f40'
  - variable: NOTION_API_TOKEN
    secret: NOTION_API_TOKEN
    availability:
      - RUNTIME
  - variable: NPM_CONFIG_PRODUCTION
    value: 'false'
  - variable: NPM_CONFIG_INCLUDE
    value: 'dev'
  - variable: MONGO
    secret: MONGO
    availability:
      - RUNTIME
  - variable: FFMPEG_MCP_URL
    secret: FFMPEG_MCP_URL
    availability:
      - RUNTIME
  - variable: FFMPEG_MCP_API_TOKEN
    secret: FFMPEG_MCP_API_TOKEN
    availability:
      - RUNTIME
  - variable: CLOUDFLARE_WEBHOOK_SECRET
    secret: CLOUDFLARE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: CHART_MCP_URL
    secret: CHART_MCP_URL
    availability:
      - RUNTIME
  - variable: CHART_MCP_API_TOKEN
    secret: CHART_MCP_API_TOKEN
    availability:
      - RUNTIME
  - variable: SLACK_ALERT_WEBHOOK_URL
    secret: SLACK_ALERT_WEBHOOK_URL
    availability:
      - RUNTIME
  - variable: SLACK_SENTRY_ALERT_WEBHOOK_URL
    secret: SLACK_SENTRY_WEBHOOK_URL
    availability:
      - RUNTIME
  - variable: SLACK_AGENT_ALERT_WEBHOOK_URL
    secret: SLACK_AGENT_ALERT_WEBHOOK_URL
    availability:
      - RUNTIME
  - variable: SLACK_SALES_ALERT_WEBHOOK_URL
    secret: SLACK_SALES_ALERT_WEBHOOK_URL
    availability:
      - RUNTIME
  - variable: SLACK_NEW_ATHLETES_WEBHOOK_URL
    secret: SLACK_NEW_ATHLETES_WEBHOOK_URL
