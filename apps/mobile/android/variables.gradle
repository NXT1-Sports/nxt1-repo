ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    kotlin_version = '2.1.0'
    // MSAL 8.4.1 (2026-07-15) — latest stable.
    // Fixes:
    //   - IllegalStateException (Unexpected fragment type) in CurrentTaskAuthorizationActivity (regressed Jul 9)
    //   - NPE in InstallCertActivityLauncher.onResume (null Intent passed to non-null ActivityResultLauncher)
    //   - Retains the 8.3.3 fix: multiple-listening-apps check moved out of
    //     PublicClientApplicationConfiguration init, avoiding activityInfo.name NPE.
    // BrokerActivity still needs app-level restore protection in AndroidManifest.xml
    // because it can start a null nested broker Intent if Android restores stale state.
    recognizebvMSALVersion = '8.4.1'
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}
