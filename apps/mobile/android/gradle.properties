# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=false
android.useAndroidX=true

# Microsoft Android auth:
# Set this to the Base64-encoded SHA-1 certificate signature hash that Azure
# App Registration expects for Android. Gradle derives the URL-encoded msauth
# manifest redirect path from this same raw Base64 value.
msauthKeyHash=VokRCzUgWcDWHc9VBOcyJSVWaDg=
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Kotlin version for Capacitor
kotlin_version=2.1.0
