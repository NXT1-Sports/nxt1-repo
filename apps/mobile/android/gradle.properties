# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=false
android.useAndroidX=true

# Microsoft Android auth:
# Set this to the Base64-encoded SHA-1 certificate signature hash that Azure
# App Registration expects for Android. Gradle derives the URL-encoded msauth
# manifest redirect path from this same raw Base64 value.
#
# ⚠️ IMPORTANT: This hash MUST also be registered in the Azure portal:
#   Azure Portal → Microsoft Entra ID → App registrations →
#   App 'aaceb7d3-bc1d-4c44-a871-cb96826558de' → Authentication → Android platform
#   Redirect URI: msauth://com.nxt1sports.app.twa/tbJ8Q~zddVLSm32FfNPgBOcpPXJsAGlB6b2_PcqL
#
# This hash was extracted from the AADSTS50011 error (production APK, Aug 11 2026).
# It reflects the Play Store App Signing certificate (managed by Google).
# The previous value (VokRCzUgWcDWHc9VBOcyJSVWaDg=) was from a different/older cert.
msauthKeyHash=tbJ8Q~zddVLSm32FfNPgBOcpPXJsAGlB6b2_PcqL
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Kotlin version for Capacitor
kotlin_version=2.1.0
