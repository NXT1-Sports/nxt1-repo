apply plugin: 'com.android.application'

// Load signing properties from key.properties (never commit this file)
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def msAuthAndroidKeyHash = (project.findProperty("msauthKeyHash") ?: "").toString()
def msAuthRedirectPath = msAuthAndroidKeyHash
    ? "/" + java.net.URLEncoder.encode(msAuthAndroidKeyHash, "UTF-8")
    : "/__missing_msauth_key_hash__"

android {
    namespace "com.nxt1sports.app.twa"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nxt1sports.app.twa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1302
        versionName "5.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            msauthRedirectPath: msAuthRedirectPath
        ]
        resValue "string", "msauth_android_key_hash", msAuthAndroidKeyHash
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // Debug build type
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    bundle {
        abi {
            // Disable all AAB splits → Play Store serves a single universal APK to ALL devices.
            // Required because previous production releases were universal (no splits),
            // so any device that had the old app installed must be able to receive an upgrade.
            enableSplit false
        }
        density {
            enableSplit false
        }
        language {
            enableSplit false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // Firebase BOM — manages all Firebase SDK versions
    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    // firebase-perf removed — its Gradle plugin caused AAB routing conflicts in Play Store
    
    // Firebase Crashlytics & Analytics (Required for proper routing and crash-free users)
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Firebase Crashlytics plugin - upload mapping files for deobfuscation
        apply plugin: 'com.google.firebase.crashlytics'
        // firebase-perf plugin removed — caused AAB routing conflicts in Play Store
        
        // Configure Crashlytics after plugin is applied
        android.buildTypes.release {
            firebaseCrashlytics {
                // Upload mapping files for code deobfuscation
                mappingFileUploadEnabled true
                // nativeSymbolUploadEnabled is for NDK/C++ apps only.
                // Capacitor is a WebView app — no custom native code, so this must be false.
                // Setting to true with no NDK code breaks ABI coverage in the AAB.
                nativeSymbolUploadEnabled false
            }
        }
        android.buildTypes.debug {
            firebaseCrashlytics {
                // Disable Crashlytics mapping uploads in debug builds for faster builds
                mappingFileUploadEnabled false
            }
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
