# Firebase App Hosting Configuration — STAGING
# @see https://firebase.google.com/docs/app-hosting
#
# Configure the staging App Hosting backend in Firebase Console to use this file:
#   Firebase Console → App Hosting → staging backend → Settings → Root directory → apphosting.staging.yaml
#
# Project: nxt-1-staging-v2
# URL: https://nxt1-repo--nxt-1-staging-v2.us-east4.hosted.app

# Build from the monorepo root so App Hosting uses the workspace lockfile
# and root gcp-build script for @nxt1/web.
rootDirectory: .

# Build and server entry point
scripts:
  buildCommand: npm run build:staging --workspace=@nxt1/web
  runCommand: node apps/web/dist/nxt1-web/server/server.mjs

# Runtime configuration
runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 1
  maxInstances: 5

# Environment variables — APP_ENV=staging triggers `ng build --configuration staging`
# in the gcp-build script, which bundles environment.staging.ts
env:
  - variable: NODE_VERSION
    value: '22'
  - variable: NODE_ENV
    value: 'staging'
  - variable: APP_ENV
    value: 'staging'

  # Public staging origin used for SSR redirects and absolute URL generation
  - variable: PUBLIC_URL
    value: 'https://staging.nxt1sports.com'

  # Staging backend host for sitemap/XML proxying.
  # Keep this on the staging App Hosting backend so root-level endpoints like
  # /sitemap.xml continue to resolve against the staging runtime.
  - variable: BACKEND_URL
    value: 'https://nxt1-repo-backend--nxt-1-staging-v2.us-east4.hosted.app'

  # Explicit staging API base URL so SSR profile lookups hit the same API surface as the browser
  - variable: BACKEND_API_URL
    value: 'https://api.nxt1sports.com/api/v1/staging'

  # Allow SSR for ALL hosts
  - variable: NG_ALLOWED_HOSTS
    value: '*'

  # Include dev dependencies for TypeScript build
  - variable: NPM_CONFIG_PRODUCTION
    value: 'false'
  - variable: NPM_CONFIG_INCLUDE
    value: 'dev'

# Custom headers for all responses
headers:
  # Security headers + default no-cache for all SSR routes
  - source: '**'
    headers:
      - header: X-Content-Type-Options
        value: nosniff
      - header: X-Frame-Options
        value: SAMEORIGIN
      - header: X-XSS-Protection
        value: '1; mode=block'
      - header: Referrer-Policy
        value: strict-origin-when-cross-origin
      - header: Cache-Control
        value: 'no-cache, no-store, must-revalidate'

  # Cache static assets aggressively (content-hashed filenames bust old caches)
  - source: '**/*.{js,css,woff2,woff,ttf,png,jpg,jpeg,gif,svg,ico,webp}'
    headers:
      - header: Cache-Control
        value: 'public, max-age=31536000, immutable'

  # Don't cache HTML pages
  - source: '**/*.html'
    headers:
      - header: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
